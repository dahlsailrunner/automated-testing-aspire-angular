<h1>Checkout</h1>

@if (loading()) {
  <p>Loading...</p>
} @else {
  <p><strong>Email:</strong> {{ auth.email() }}</p>

  <ul class="summary-list">
    @for (item of items(); track item.productId) {
      <li>{{ item.quantity }} &times; {{ item.name }} &mdash; {{ item.total | currency }}</li>
    }
  </ul>

  <div class="grand-total">Total: {{ total | currency }}</div>

  <div class="checkout-actions">
    <button mat-stroked-button (click)="cancelOrder()" [disabled]="submitting()">Cancel Order / Clear Cart</button>
    <button mat-raised-button color="primary" (click)="submitOrder()" [disabled]="submitting()">Submit Order</button>
  </div>
}
